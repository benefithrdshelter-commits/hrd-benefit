<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin - Penggabungan Keluarga</title>
<style>
  .kg-head h1{font-size:19px;font-weight:700;margin:0 0 4px}
  .kg-head p{font-size:12.5px;color:var(--muted);margin:0}
  .tabs{display:flex;gap:6px;margin-bottom:16px}
  .tab{border:none;background:transparent;padding:8px 15px;border-radius:99px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit}
  .tab.active{background:var(--blue-tint);color:var(--blue-deep)}
  .tab .cnt{background:rgba(0,0,0,.07);border-radius:99px;padding:1px 7px;margin-left:5px;font-size:11px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:0 10px 10px;border-bottom:1.5px solid var(--line);font-weight:700}
  tbody td{padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  .who{display:flex;align-items:center;gap:11px}
  .av{width:36px;height:36px;border-radius:50%;background:var(--blue-tint);color:var(--blue-deep);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
  .who b{display:block;font-size:13px}
  .who span{display:block;font-size:11.5px;color:var(--muted)}
  .bu b{display:block;font-size:12.5px}
  .bu span{display:block;font-size:11.5px;color:var(--muted)}
  select.stpick{border-radius:99px;font-size:11.5px;font-weight:700;padding:5px 26px 5px 12px;border:1.5px solid transparent;font-family:inherit;cursor:pointer;appearance:none;background-repeat:no-repeat;background-position:right 9px center;background-size:9px}
  select.stpick.red{background-color:#FDECEA;color:var(--red,#D9382B)}
  select.stpick.amber{background-color:var(--amber-tint);color:var(--amber)}
  select.stpick.green{background-color:var(--green-tint);color:var(--green)}
  .btn-lihat{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700;color:var(--blue-deep);cursor:pointer;font-family:inherit}
  .btn-lihat:hover{background:var(--blue-tint)}
  .btn-hapus{border:1px solid #F3C4BF;background:#fff;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700;color:#D9382B;cursor:pointer;font-family:inherit}
  .btn-hapus:hover{background:#FDECEA;border-color:#E4483A}
  .aksi{display:flex;gap:8px;justify-content:flex-end}
  .btn-logout{display:inline-flex;align-items:center;gap:8px;background:#E4483A;color:#fff !important;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;box-shadow:0 8px 18px -8px rgba(228,72,58,.6)}
  .btn-logout:hover{background:#C93A2D}
  .empty{text-align:center;padding:50px 10px;color:var(--muted);font-size:13px}
  .loading{text-align:center;padding:40px 10px;color:var(--muted);font-size:13px}

  /* ---- detail view ---- */
  .dtop{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .btn-back{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--navy-1);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .btn-back:hover{border-color:var(--blue);color:var(--blue-deep)}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .dpanel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px}
  .dpanel h4{font-size:13px;font-weight:700;color:var(--navy-1);margin:0 0 14px;text-transform:uppercase;letter-spacing:.03em}
  .drow{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .drow:last-child{border-bottom:none}
  .drow .k{color:var(--muted);flex:none}
  .drow .v{text-align:right;font-weight:600}
  .anggota-list{display:flex;flex-wrap:wrap;gap:6px}
  .anggota-list span{background:var(--blue-tint);color:var(--blue-deep);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600}
  .docs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .doc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#F6F8FC}
  .doc .lbl{font-size:11.5px;font-weight:700;color:var(--navy-1);padding:9px 12px;border-bottom:1px solid var(--line);background:#fff}
  .doc img{width:100%;height:150px;object-fit:contain;display:block;background:#fff;cursor:zoom-in}
  .doc .miss{padding:36px 10px;text-align:center;color:var(--muted);font-size:12px}
  @media (max-width:900px){.dgrid,.docs{grid-template-columns:1fr}}

  .lightbox{display:none;position:fixed;inset:0;background:rgba(11,30,62,.82);z-index:50;align-items:center;justify-content:center;padding:26px}
  .lightbox.open{display:flex}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px}
  .lightbox .close{position:absolute;top:20px;right:26px;color:#fff;font-size:30px;cursor:pointer;line-height:1}
</style>
</head>
<body>
<div class="app-shell">
  <?!= sidebarHtml ?>
  <div class="app-content">

    <div class="hero-banner compact">
      <div class="topbar">
        <div class="spacer"></div>
        <a class="btn-logout" href="<?!= baseUrl ?>?page=logout&token=<?!= token ?>" target="_top">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M7.5 17.5H4.5C3.7 17.5 3 16.8 3 16V4C3 3.2 3.7 2.5 4.5 2.5H7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M13 14L17 10L13 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 10H7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Keluar
        </a>
      </div>
      <div class="hero-body">
        <div>
          <div class="page-title">Penggabungan Keluarga</div>
          <div class="page-sub">Daftar pengajuan penambahan anggota keluarga BPJS Kesehatan dari karyawan.</div>
        </div>
      </div>
    </div>

    <div id="viewList">
      <div class="tabs">
        <button class="tab active" data-f="all">Semua <span class="cnt" id="cAll">0</span></button>
        <button class="tab" data-f="Diajukan">Diajukan <span class="cnt" id="cD">0</span></button>
        <button class="tab" data-f="Diproses">Diproses <span class="cnt" id="cP">0</span></button>
        <button class="tab" data-f="Selesai">Selesai <span class="cnt" id="cS">0</span></button>
      </div>
      <div class="card">
        <table>
          <thead><tr><th>Karyawan</th><th>Badan Usaha / Site</th><th>Status</th><th></th></tr></thead>
          <tbody id="tbody"><tr><td colspan="4" class="loading">Memuat data...</td></tr></tbody>
        </table>
      </div>
    </div>

    <div id="viewDetail" style="display:none">
      <div class="dtop"><button class="btn-back" id="btnBack">&lsaquo; Kembali ke daftar</button></div>
      <div class="dgrid">
        <div class="dpanel">
          <h4>Data Tenaga Kerja</h4>
          <div id="dInfo"></div>
        </div>
        <div class="dpanel">
          <h4>Anggota Keluarga Diajukan</h4>
          <div class="anggota-list" id="dAnggota"></div>
        </div>
      </div>
      <div class="dpanel" style="margin-top:22px">
        <h4>Dokumen Terlampir</h4>
        <div class="docs" id="dDocs"></div>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox"><span class="close" id="lbClose">&times;</span><img id="lbImg" src=""></div>

<script>
var ALL = [], FILTER = 'all', TOKEN = "<?= token ?>";
function $(id){ return document.getElementById(id); }
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ini(n){ return String(n||'?').trim().charAt(0).toUpperCase(); }
function stClass(s){ return s === 'Selesai' ? 'green' : (s === 'Diproses' ? 'amber' : 'red'); }
function fmtDate(ts){
  if(!ts) return '-'; var d = new Date(ts); if(isNaN(d.getTime())) return ts;
  var bln=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  return d.getDate()+' '+bln[d.getMonth()]+' '+d.getFullYear();
}

function load(){
  google.script.run.withSuccessHandler(function(raw){
    var rows = []; try{ rows = JSON.parse(raw); }catch(e){ rows = []; }
    ALL = Array.isArray(rows) ? rows : [];
    render();
  }).withFailureHandler(function(err){
    $('tbody').innerHTML = '<tr><td colspan="4" class="empty">Gagal memuat: '+esc(err && err.message ? err.message : err)+'</td></tr>';
  }).getKeluargaSubmissions();
}

function render(){
  var cD = ALL.filter(function(r){ return r.status !== 'Diproses' && r.status !== 'Selesai'; }).length;
  var cP = ALL.filter(function(r){ return r.status === 'Diproses'; }).length;
  var cS = ALL.filter(function(r){ return r.status === 'Selesai'; }).length;
  $('cAll').textContent = ALL.length; $('cD').textContent = cD; $('cP').textContent = cP; $('cS').textContent = cS;

  var rows = ALL.filter(function(r){
    if(FILTER === 'all') return true;
    if(FILTER === 'Diajukan') return r.status !== 'Diproses' && r.status !== 'Selesai';
    return r.status === FILTER;
  });

  if(rows.length === 0){ $('tbody').innerHTML = '<tr><td colspan="4" class="empty">Belum ada pengajuan di kategori ini.</td></tr>'; return; }

  $('tbody').innerHTML = rows.map(function(r){
    var st = r.status || 'Diajukan', cls = stClass(st);
    return '<tr>'
      + '<td><div class="who"><div class="av">'+esc(ini(r.namaTk))+'</div><div><b>'+esc(r.namaTk)+'</b><span>'+esc(r.noWhatsapp||'-')+' &middot; '+esc(r.email||'-')+'</span></div></div></td>'
      + '<td><div class="bu"><b>'+esc(r.badanUsaha||'-')+'</b><span>'+esc(r.site||'-')+'</span></div></td>'
      + '<td><select class="stpick '+cls+'" data-row="'+r.rowNumber+'">'
        + '<option value="Diajukan"'+(st==='Diajukan'?' selected':'')+'>&#9679; Diajukan</option>'
        + '<option value="Diproses"'+(st==='Diproses'?' selected':'')+'>&#9679; Diproses</option>'
        + '<option value="Selesai"'+(st==='Selesai'?' selected':'')+'>&#9679; Selesai</option>'
      + '</select></td>'
      + '<td><div class="aksi"><button class="btn-lihat" data-row="'+r.rowNumber+'">Lihat Data</button>'
        + '<button class="btn-hapus" data-row="'+r.rowNumber+'" data-ts="'+esc(r.timestamp)+'" data-nama="'+esc(r.namaTk)+'">Hapus</button></div></td>'
      + '</tr>';
  }).join('');
}

document.querySelector('.tabs').addEventListener('click', function(e){
  var t = e.target.closest('.tab'); if(!t) return;
  FILTER = t.getAttribute('data-f');
  [].forEach.call(document.querySelectorAll('.tab'), function(x){ x.classList.toggle('active', x === t); });
  render();
});

$('tbody').addEventListener('change', function(e){
  if(!e.target.classList.contains('stpick')) return;
  var sel = e.target, row = Number(sel.getAttribute('data-row')), val = sel.value;
  sel.className = 'stpick ' + stClass(val);
  google.script.run.withSuccessHandler(function(res){
    if(!(res && res.success)) return alert('Gagal menyimpan status.');
    var item = ALL.filter(function(r){ return r.rowNumber === row; })[0];
    if(item) item.status = val;
    render();
  }).updateStatusKeluarga(row, val);
});

$('tbody').addEventListener('click', function(e){
  var h = e.target.closest('.btn-hapus');
  if(h){
    var nama = h.getAttribute('data-nama') || 'data ini';
    if(!confirm('Hapus pengajuan milik ' + nama + '?\n\nData dan seluruh dokumennya (KK, KTP, Akta, Buku Nikah) akan dihapus. Tindakan ini tidak bisa dibatalkan.')) return;
    h.disabled = true; h.textContent = 'Menghapus...';
    google.script.run
      .withSuccessHandler(function(res){
        if(res && res.success){ load(); }
        else { alert((res && res.error) || 'Gagal menghapus.'); h.disabled = false; h.textContent = 'Hapus'; }
      })
      .withFailureHandler(function(err){ alert('Gagal: ' + (err && err.message ? err.message : err)); h.disabled = false; h.textContent = 'Hapus'; })
      .adminDeleteKeluarga(TOKEN, Number(h.getAttribute('data-row')), h.getAttribute('data-ts'));
    return;
  }
  var b = e.target.closest('.btn-lihat'); if(!b) return;
  openDetail(Number(b.getAttribute('data-row')));
});

function openDetail(rowNumber){
  var d = ALL.filter(function(r){ return r.rowNumber === rowNumber; })[0];
  if(!d) return;
  $('viewList').style.display = 'none'; $('viewDetail').style.display = 'block';

  var rows = [
    ['Tanggal Pengajuan', fmtDate(d.timestamp)],
    ['Nama Tenaga Kerja', d.namaTk],
    ['NIK KTP', d.nikKtp],
    ['No. WhatsApp', d.noWhatsapp],
    ['Email', d.email],
    ['Posisi / Bidang Jasa', d.posisiBidang || '-'],
    ['Badan Usaha', d.badanUsaha],
    ['Nama Perusahaan', d.namaPerusahaan],
    ['Site Penempatan', d.site]
  ];
  $('dInfo').innerHTML = rows.map(function(r){
    return '<div class="drow"><span class="k">'+esc(r[0])+'</span><span class="v">'+esc(r[1]||'-')+'</span></div>';
  }).join('');

  var anggota = d.anggotaKeluarga || [];
  $('dAnggota').innerHTML = anggota.length
    ? anggota.map(function(a){ return '<span>'+esc(a)+'</span>'; }).join('')
    : '<span style="background:none;color:var(--muted);padding:0;">Tidak ada data.</span>';

  var docs = [['Kartu Keluarga', d.kkFileId], ['KTP', d.ktpFileId], ['Akta Kelahiran', d.aktaFileId], ['Buku Nikah', d.bukuNikahFileId]];
  $('dDocs').innerHTML = docs.map(function(x){
    return '<div class="doc"><div class="lbl">'+esc(x[0])+'</div><div class="ph" data-fileid="'+esc(x[1])+'"><div class="miss">Memuat...</div></div></div>';
  }).join('');

  docs.forEach(function(x, idx){
    var holder = document.querySelectorAll('#dDocs .ph')[idx];
    if(!x[1]){ holder.innerHTML = '<div class="miss">Tidak diupload.</div>'; return; }
    google.script.run.withSuccessHandler(function(url){
      holder.innerHTML = url ? '<img src="'+url+'" data-full="'+url+'">' : '<div class="miss">Gagal memuat gambar.</div>';
    }).withFailureHandler(function(){ holder.innerHTML = '<div class="miss">Gagal memuat gambar.</div>'; }).getImageDataUrl(x[1]);
  });
}

$('btnBack').onclick = function(){ $('viewDetail').style.display = 'none'; $('viewList').style.display = 'block'; };

$('dDocs').addEventListener('click', function(e){
  var img = e.target.closest('img'); if(!img) return;
  $('lbImg').src = img.getAttribute('data-full'); $('lightbox').classList.add('open');
});
$('lbClose').onclick = function(){ $('lightbox').classList.remove('open'); };
$('lightbox').addEventListener('click', function(e){ if(e.target.id === 'lightbox') $('lightbox').classList.remove('open'); });

load();
</script>
</body>
</html>
