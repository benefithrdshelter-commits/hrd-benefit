<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-1:#0B255A; --navy-2:#1E3E7A; --navy-3:#0E2A5C;
    --active-blue:#4F8AD1;
    --blue:#00B5FC; --blue-deep:#0B7FC7; --blue-tint:#E6F6FE;
    --paper:#EEF2F7; --ink:#131B24; --muted:#667085; --line:#E2E5EA;
    --amber:#B4552E; --amber-tint:#FBEEE8; --green:#2F7D4F; --green-tint:#E9F5EC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Arial,sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased;
    background:var(--paper);
  }
  a{color:inherit;}
  h1,h2,h3,.num{font-family:'Plus Jakarta Sans',sans-serif; font-weight:700;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}

  .app-shell{display:flex; min-height:100vh;}

  /* ---------- Sidebar: gradasi navy + glow biru dekoratif di bawah ---------- */
  .app-sidebar{
    width:240px; flex:none; color:#fff; position:sticky; top:0; height:100vh; align-self:flex-start; overflow-x:hidden; overflow-y:auto;
    background:radial-gradient(circle 260px at 40px 100%, rgba(130,195,255,.30), transparent 72%), radial-gradient(circle 330px at 60px calc(100% + 70px), rgba(90,170,255,.22), transparent 72%), linear-gradient(180deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
    display:flex; flex-direction:column; padding:22px 0; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.25) transparent;
  }
  .app-sidebar::before, .app-sidebar::after{display:none !important;}
  .app-sidebar::before{
    content:''; position:absolute; left:-50px; bottom:-70px; width:280px; height:280px; border-radius:50%;
    background:radial-gradient(circle at 32% 32%, rgba(130,195,255,.32), transparent 70%);
    pointer-events:none;
  }
  .app-sidebar::after{
    content:''; position:absolute; left:-30px; bottom:-160px; width:340px; height:340px; border-radius:50%;
    background:radial-gradient(circle at 40% 40%, rgba(90,170,255,.22), transparent 70%);
    pointer-events:none;
  }
  .app-sidebar > *{position:relative; z-index:1;}

  .app-sidebar .brand{display:flex; align-items:center; gap:10px; padding:0 20px 20px; border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:12px;}
  .app-sidebar .brand-mark{width:34px; height:34px; flex:none; border-radius:9px; overflow:hidden;}
  .app-sidebar .brand-mark img{width:100%; height:100%; object-fit:cover; display:block;}
  .app-sidebar .brand-text .t1{font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size:15.5px; letter-spacing:.01em; color:#fff;}
  .app-sidebar .brand-text .t2{font-size:9.5px; color:rgba(255,255,255,.55); margin-top:2px; letter-spacing:.03em;}

  .app-sidebar nav{flex:1; display:flex; flex-direction:column; padding:6px 14px; overflow-y:auto;}
  .app-sidebar .nav-label{font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:rgba(255,255,255,.34); margin:16px 10px 6px; font-weight:600;}
  .app-sidebar a.nav-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px;
    color:rgba(255,255,255,.72); text-decoration:none; font-size:13.5px; font-weight:500;
    transition:background .15s, color .15s;
  }
  .app-sidebar a.nav-item svg{flex:none; opacity:.85;}
  .app-sidebar a.nav-item:hover{background:rgba(255,255,255,.08); color:#fff;}
  .app-sidebar a.nav-item.active{
    background:var(--active-blue); color:#fff; font-weight:600;
    box-shadow:0 6px 16px rgba(79,138,209,.4);
  }
  .app-sidebar a.nav-item.active svg{opacity:1;}

  .help-card{
    margin:14px 14px 0; padding:16px 14px; border-radius:14px;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1);
  }
  .help-card .help-icon{
    width:34px; height:34px; border-radius:9px; background:rgba(255,255,255,.12);
    display:flex; align-items:center; justify-content:center; color:#fff; margin-bottom:10px;
  }
  .help-card .help-title{font-size:13px; font-weight:700; color:#fff; margin-bottom:3px;}
  .help-card .help-sub{font-size:11px; color:rgba(255,255,255,.6); line-height:1.5; margin-bottom:12px;}
  .help-card .help-contact{
    display:flex; align-items:center; gap:7px; font-size:11.5px; font-weight:600; color:#fff;
    text-decoration:none; background:rgba(255,255,255,.1); border-radius:8px; padding:7px 10px; margin-bottom:6px;
  }
  .help-card .help-contact:last-child{margin-bottom:0;}
  .help-card .help-contact:hover{background:var(--active-blue);}
  .help-card .help-contact svg{flex:none; color:#6FE0A0;}

  .app-sidebar .sidebar-footer{padding:16px 14px 0; margin-top:10px;}
  .app-sidebar a.logout-link{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px;
    font-size:13.5px; color:rgba(255,255,255,.65); text-decoration:none; font-weight:500;
  }
  .app-sidebar a.logout-link:hover{background:rgba(255,255,255,.08); color:#fff;}


  /* ---------- Sidebar bisa diperkecil (tombol panah) ---------- */
  .app-sidebar{transition:width .28s cubic-bezier(.4,0,.2,1);}
  .app-sidebar .brand, .app-sidebar nav, .app-sidebar a.nav-item{transition:padding .28s, gap .28s;}
  .app-sidebar .nav-label, .app-sidebar .brand-text, .app-sidebar a.nav-item .label{white-space:nowrap;}
  .app-sidebar a.nav-item{position:relative;}
  .sb-toggle{
    position:fixed; top:74px; left:228px; z-index:40; width:26px; height:26px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
    background:#fff; color:#0B2A6B; border:1px solid #D5DEEE; box-shadow:0 4px 12px rgba(8,30,90,.28);
    transition:left .28s cubic-bezier(.4,0,.2,1), transform .28s, background .15s, color .15s;
  }
  .sb-toggle:hover{background:var(--active-blue); color:#fff; border-color:var(--active-blue);}
  .sb-toggle svg{transition:transform .28s;}
  .sb-min .sb-toggle svg, .sb-toggle.min svg{transform:rotate(180deg);}
  .sb-toggle.min{left:64px;}

  .app-sidebar.sb-min{width:76px;}
  .app-sidebar.sb-min .brand{padding:0 0 18px; justify-content:center;}
  .app-sidebar.sb-min .brand-text{display:none;}
  .app-sidebar.sb-min nav{padding:6px 12px; align-items:stretch;}
  .app-sidebar.sb-min .nav-label{font-size:0; height:1px; background:rgba(255,255,255,.14); margin:12px 10px;}
  .app-sidebar.sb-min a.nav-item{justify-content:center; gap:0; padding:12px 0;}
  .app-sidebar.sb-min a.nav-item .label{display:none;}
  .app-sidebar.sb-min a.nav-item svg{width:20px; height:20px;}
  .app-sidebar.sb-min a.nav-item > span[id^="badge"]{position:absolute; top:5px; right:7px; margin:0 !important; padding:0 !important; min-width:0 !important; width:9px; height:9px; font-size:0 !important; border-radius:50% !important; box-shadow:0 0 0 2px #0B2A6B;}
  .app-sidebar.sb-min .help-card{margin:14px 6px 0; padding:8px 0; background:transparent; border:0; text-align:center;}
  .app-sidebar.sb-min .help-card .help-title, .app-sidebar.sb-min .help-card .help-sub, .app-sidebar.sb-min .help-card .help-contact{display:none;}
  .app-sidebar.sb-min .help-card .help-icon{margin:0 auto; width:42px; height:42px; border-radius:12px;}
  @media (max-width:900px){ .sb-toggle{display:none !important;} .app-sidebar.sb-min{width:auto;} .app-sidebar.sb-min .brand-text, .app-sidebar.sb-min a.nav-item .label{display:revert;} }
  @media print{ .sb-toggle{display:none !important;} }

  /* ---------- Konten utama ---------- */
  .app-content{flex:1; min-width:0; padding:22px 28px 36px; background:var(--paper);}
  .topbar{display:flex; align-items:center; gap:16px; margin-bottom:22px;}
  .topbar .search-wrap{position:relative; flex:1; max-width:420px;}
  .topbar .search-wrap svg.icon{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted);}
  .topbar .search{
    width:100%; background:#fff; border:1px solid var(--line); border-radius:9px;
    padding:11px 60px 11px 38px; font-size:13px; font-family:inherit; color:var(--ink);
  }
  .topbar .search:focus{outline:none; border-color:var(--blue);}
  .topbar .kbd-hint{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    font-size:10.5px; color:var(--muted); background:#F1F3F6; border:1px solid var(--line);
    border-radius:5px; padding:2px 6px;
  }
  .topbar .spacer{flex:1;}
  .topbar .bell{
    width:38px; height:38px; border-radius:9px; border:1px solid var(--line); display:flex;
    align-items:center; justify-content:center; color:var(--muted); flex:none; background:#fff; position:relative;
    cursor:pointer;
  }
  .topbar .bell .badge{
    position:absolute; top:-5px; right:-5px; min-width:17px; height:17px; padding:0 4px; border-radius:9px;
    background:#E4483A; color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--paper);
  }
  .topbar .bell .badge:empty{display:none;}
  .topbar .user{display:flex; align-items:center; gap:10px; padding-left:14px; border-left:1px solid var(--line);}
  .topbar .user-avatar{
    width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--blue-deep)); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:none;
    font-family:'Plus Jakarta Sans',sans-serif;
  }
  .topbar .user-info .name{font-size:12.5px; font-weight:600; line-height:1.3;}
  .topbar .user-info .role{font-size:11px; color:var(--muted); line-height:1.3;}
  .topbar .chevron{color:var(--muted); flex:none;}
    /* ---------- Aksi topbar (bell + user + logout) dibungkus pill supaya kelihatan di atas foto ---------- */
  .topbar-actions{
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.32);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    padding:6px 10px 6px 6px; border-radius:14px;
    box-shadow:0 4px 18px rgba(9,33,68,.18);
  }
  .topbar-actions .logout-btn{
    display:flex; align-items:center; justify-content:center;
    width:38px; height:38px; border-radius:9px; flex:none;
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28);
    color:#fff; text-decoration:none; transition:background .15s;
  }
  .topbar-actions .logout-btn:hover{background:#E4483A; border-color:#E4483A;}

  /* ---------- Section heading ---------- */
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin:0 0 12px;}
  .section-head h2{font-size:15px; font-weight:600; margin:0; color:var(--ink);}
  .section-head a{font-size:12px; color:var(--blue-deep); text-decoration:none; font-weight:500;}

  /* ---------- Hero: ilustrasi pekerja + shield ---------- */

    position:relative; overflow:hidden; border-radius:16px; margin-bottom:22px;
    display:flex; flex-direction:column; padding:0;

      linear-gradient(90deg, rgba(9,33,68,.86) 0%, rgba(9,33,68,.55) 42%, rgba(9,33,68,.05) 72%),

  .hero-banner .topbar{display:flex; align-items:center; gap:16px; padding:16px 30px 0;}
  .hero-banner .topbar .search-wrap input{background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3); color:#fff;}
  .hero-banner .topbar .search-wrap input::placeholder{color:rgba(255,255,255,.65);}
  .hero-banner .topbar .search-wrap svg.icon{color:rgba(255,255,255,.75);}
  .hero-banner .topbar .kbd-hint{background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.28); color:rgba(255,255,255,.8);}
  .hero-banner .topbar .bell{background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.28); color:#fff;}
  .hero-banner .topbar .bell .badge{border-color:rgba(9,33,68,.9);}
  .hero-banner .topbar .user{border-left-color:rgba(255,255,255,.28);}
  .hero-banner .topbar .user-info .name{color:#fff;}
  .hero-banner .topbar .user-info .role{color:rgba(255,255,255,.72);}
  .hero-banner .topbar .chevron{color:rgba(255,255,255,.75);}
  .hero-banner .topbar .btn-refresh{background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.28); color:#fff;}
  .hero-banner .hero-body{padding:22px 36px 34px; flex:1; display:flex; align-items:center; min-height:170px;}
  .hero-banner .eyebrow{font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:#3FE0A8; margin-bottom:10px;}
  .hero-banner h1{font-size:27px; font-weight:700; margin:0 0 10px; color:#fff; line-height:1.25; max-width:15ch;}
  .hero-banner h1 .accent{color:#8ED9FF;}
  .hero-banner p{font-size:13.5px; color:rgba(255,255,255,.82); margin:0; max-width:42ch; line-height:1.6;}
  .hero-banner .corner-note{
    position:absolute; top:68px; right:34px; text-align:right; font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:600; font-size:15px; line-height:1.4; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  .hero-banner .corner-note .hl{color:#8ED9FF;}

  /* ---------- Hero compact: dipakai di halaman selain Dashboard, gantiin .page-head polos ---------- */
  .hero-banner.compact{
    background:
      linear-gradient(90deg, rgba(9,33,68,.88) 0%, rgba(9,33,68,.72) 55%, rgba(9,33,68,.35) 100%),
      url('data:image/jpeg;base64,''' + open('hero_illustration_b64.txt').read().strip() + '''');
    background-size:cover; background-position:center 22%;
  }
  .hero-banner.compact .hero-topbar{padding:14px 26px 0;}
  .hero-banner.compact .hero-body{padding:14px 26px 20px; min-height:0;}
  .hero-banner.compact .page-title{margin:0 0 4px; color:#fff; font-size:19px;}
  .hero-banner.compact .page-sub{margin:0; color:rgba(255,255,255,.78); font-size:12.5px;}

  /* ---------- Kartu statistik terpisah (bukan strip nyatu) ---------- */
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:22px;}
  .stat-card{
    background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px;
    display:flex; flex-direction:column; gap:10px; position:relative; overflow:hidden;
  }
  .stat-card .top-row{display:flex; align-items:flex-start; justify-content:space-between;}
  .stat-card .ic{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none;}
  .stat-card.c-blue .ic{background:#E3EEFF; color:#3D7BD9;}
  .stat-card.c-amber .ic{background:#FFEDE0; color:#E07A2E;}
  .stat-card.c-green .ic{background:#E1F7EC; color:#22B573;}

<script>
(function(){
  var sb = document.getElementById('appSidebar'), btn = document.getElementById('sbToggle');
  if(!sb || !btn) return;
  function simpan(v){ try{ localStorage.setItem('sb_min', v ? '1' : '0'); }catch(e){} }
  function baca(){ try{ return localStorage.getItem('sb_min') === '1'; }catch(e){ return false; } }
  function terapkan(min, anim){
    sb.classList.toggle('sb-min', min);
    btn.classList.toggle('min', min);
    sb.querySelectorAll('a.nav-item').forEach(function(a){
      var l = a.querySelector('.label');
      if(min && l) a.setAttribute('title', l.textContent.trim()); else a.removeAttribute('title');
    });
    if(anim) setTimeout(function(){ try{ window.dispatchEvent(new Event('resize')); }catch(e){} }, 320);
  }
  terapkan(baca(), false);
  btn.addEventListener('click', function(){
    var min = !sb.classList.contains('sb-min');
    terapkan(min, true); simpan(min);
  });
})();
</script>
<script>

(function(){
  var SVG = '<svg viewBox="0 0 20 20" width="17" height="17" fill="none" aria-hidden="true"><path d="M4 6h12M8 6V4.5c0-.5.4-1 1-1h2c.6 0 1 .5 1 1V6M5.5 6l.7 9.5c0 .8.6 1.5 1.5 1.5h4.6c.9 0 1.5-.7 1.5-1.5L14.5 6M8.5 9.5v4M11.5 9.5v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function cocok(el){
    var s = (el.className || '') + ' ' + (el.getAttribute('onclick') || '') + ' ' + (el.getAttribute('title') || '') + ' ' + (el.getAttribute('aria-label') || '');
    return /hapus|delete|trash|remove/i.test(s);
  }
  function rapikan(){
    document.querySelectorAll('.app-content table button, .app-content table a, .app-content table [role="button"]').forEach(function(el){
      if (el.getAttribute('data-trash') === '1' || !cocok(el)) return;

    new MutationObserver(function(){ clearTimeout(tm); tm = setTimeout(rapikan, 60); }).observe(host, {childList:true, subtree:true});
    rapikan();
  }
  if (document.readyState !== 'loading') mulai(); else document.addEventListener('DOMContentLoaded', mulai);
})();

(function(){
  var TOKEN     = '<?!= token ?>';
  var IS_VIEWER = <?!= isViewer ? 'true' : 'false' ?>;
  window.USER_ROLE = '<?!= userRole ?>';
  window.IS_VIEWER = IS_VIEWER;

  /* ---------- A. SEMUA ROLE: setiap panggilan google.script.run otomatis membawa token ----------
     Token ditaruh sebagai argumen TERAKHIR ({__t: token}). Fungsi server yang tidak butuh akan mengabaikannya;
     fungsi tulis memeriksanya lewat guardWrite_(arguments) di Code.gs. */
  try {
    if (window.Proxy && window.google && google.script && google.script.run) {
      var CHAIN = { withSuccessHandler: 1, withFailureHandler: 1, withUserObject: 1 };
      var wrap = function (runner) {
        return new Proxy(runner, {
          get: function (target, prop) {
            var v = target[prop];
            if (typeof v !== 'function') return v;
            if (CHAIN[prop]) return function () { return wrap(v.apply(target, arguments)); };
            return function () {
              var args = Array.prototype.slice.call(arguments);
              args.push({ __t: TOKEN });
              return v.apply(target, args);
            };
          }
        });
      };
      var wrapped = wrap(google.script.run);
      try { google.script.run = wrapped; } catch (e1) {}
      if (google.script.run !== wrapped) {
        try { Object.defineProperty(google.script, 'run', { value: wrapped, configurable: true, writable: true }); } catch (e2) {}
      }
    }
  } catch (e) {}

  if (!IS_VIEWER) return;

  /* ---------- B. KHUSUS ROLE ADMIN (hanya lihat): sembunyikan / kunci semua kontrol tulis ----------
     Ini LAPISAN TAMPILAN (berbasis kata kunci), jadi tombol baru bernama aneh bisa lolos.
     Penjaga sesungguhnya ada di server (guardWrite_). Untuk menyembunyikan elemen secara pasti,
     cukup beri class="js-write" (atau atribut data-write) pada tombol/blok tersebut di file HTML-nya. */
  var css = document.createElement('style');
  css.textContent =
    '.js-write,[data-write],.viewer-hide{display:none !important;}' +
    'a[href*="jenis=pesan"],a[href*="jenis=anonim"]{display:none !important;}' +
    '.viewer-banner{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;margin:12px 16px 4px;padding:13px 16px;border-radius:18px;color:#fff;' +
    'background:radial-gradient(260px 120px at 100% 0%,rgba(79,214,232,.35),transparent 70%),linear-gradient(120deg,#0B2A6B 0%,#1456C8 60%,#2B86F5 100%);' +
    'box-shadow:0 14px 30px -14px rgba(18,102,230,.7),inset 0 0 0 1px rgba(255,255,255,.16);animation:vbIn .5s cubic-bezier(.2,.8,.2,1) both;}' +
    '.viewer-banner .vb-ic{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px);}' +
    '.viewer-banner .vb-tx{flex:1;min-width:0;font-size:12.5px;line-height:1.55;color:rgba(255,255,255,.88);}' +
    '.viewer-banner .vb-tx b{display:block;font-size:14px;font-weight:700;color:#fff;margin-bottom:1px;}' +
    '.viewer-banner .vb-chip{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.04em;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.32);white-space:nowrap;}' +
    '.viewer-banner .vb-chip i{width:7px;height:7px;border-radius:50%;background:#6FE0A0;box-shadow:0 0 0 0 rgba(111,224,160,.7);animation:vbPulse 2s infinite;}' +
    '.viewer-banner .vb-x{flex:none;width:28px;height:28px;border:0;border-radius:50%;cursor:pointer;color:#fff;background:rgba(255,255,255,.14);font-size:16px;line-height:1;display:grid;place-items:center;}' +
    '.viewer-banner .vb-x:hover{background:rgba(255,255,255,.28);}' +
    '@keyframes vbIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}' +
    '@keyframes vbPulse{0%{box-shadow:0 0 0 0 rgba(111,224,160,.7);}70%{box-shadow:0 0 0 8px rgba(111,224,160,0);}100%{box-shadow:0 0 0 0 rgba(111,224,160,0);}}' +
    '@media(max-width:700px){.viewer-banner{flex-wrap:wrap;}.viewer-banner .vb-chip{display:none;}}' +
    '.viewer-locked{opacity:.65;cursor:not-allowed !important;}';
  document.head.appendChild(css);

  var WRITE_TEXT = /\b(hapus|proses|generate|simpan|upload|unggah|tambah|buat|kirim|balas|reset|edit|ubah|tandai|batal|import|impor|ganti|submit|reply|send)\b/i;
  var WRITE_CALL = /(hapus|delete|remove|generate|proses|simpan|upload|tambah|buat|kirim|balas|tandai|regen|submit|reply|send)/i;
  var SAFE_TEXT  = /(export|excel|cetak|print|unduh|download|lihat|detail|cari|filter|keluar|logout|kembali|tutup|close|muat|daftar|template)/i;
  var SCOPE_FORM = '.detail-overlay, .detail-body, [class*="modal"], [class*="drawer"], [class*="detail"], form';

  function inTabs(el) {
    return !!el.closest('.tabs, .filter-tabs, [role="tablist"], .tab, .tab-btn, .filter-tab');
  }

  function banner() {
    if (document.getElementById('viewerBanner')) return;
    var host = document.querySelector('.app-content') || document.body;
    var b = document.createElement('div');
    b.id = 'viewerBanner';
    b.className = 'viewer-banner';
    try { if (sessionStorage.getItem('vb_closed') === '1') return; } catch (e) {}
    b.innerHTML =
      '<span class="vb-ic"><svg width="22" height="22" viewBox="0 0 20 20" fill="none"><path d="M10 2L16 4.5V9C16 13 13.5 16.3 10 17.5C6.5 16.3 4 13 4 9V4.5L10 2Z" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><path d="M7 9.8C7.8 8.6 8.8 8 10 8C11.2 8 12.2 8.6 13 9.8C12.2 11 11.2 11.6 10 11.6C8.8 11.6 7.8 11 7 9.8Z" stroke="#fff" stroke-width="1.2"/></svg></span>' +
      '<div class="vb-tx"><b>Masuk sebagai Admin</b>Akses hanya lihat data. Memproses, mengubah, mengunggah, dan menghapus hanya bisa dilakukan Super Admin.</div>' +
      '<span class="vb-chip"><i></i>HANYA LIHAT</span>' +
      '<button type="button" class="vb-x" title="Tutup" aria-label="Tutup">&times;</button>';
    b.querySelector('.vb-x').addEventListener('click', function () {
      try { sessionStorage.setItem('vb_closed', '1'); } catch (e) {}
      b.style.display = 'none';
    });
    host.insertBefore(b, host.firstChild);
  }

  function lock() {
    banner();

    document.querySelectorAll('button, a, input[type="submit"], input[type="button"], [role="button"]').forEach(function (el) {
      if (el.classList.contains('viewer-hide')) return;
      var call  = el.getAttribute('onclick') || '';
      var label = (el.textContent || '') + ' ' + (el.getAttribute('title') || '') + ' ' + (el.getAttribute('aria-label') || '') + ' ' + (el.value || '');
      var hit = false;
      if (WRITE_CALL.test(call)) hit = true;
      else if (!inTabs(el) && WRITE_TEXT.test(label) && !SAFE_TEXT.test(label)) hit = true;
      if (hit) el.classList.add('viewer-hide');
    });

    document.querySelectorAll('input[type="file"]').forEach(function (inp) {
      inp.disabled = true;
      var box = inp.closest('label, [class*="dropzone"], [class*="drop-zone"]') || inp;
      box.classList.add('viewer-hide');
    });
    document.querySelectorAll('[class*="dropzone"], [class*="drop-zone"]').forEach(function (z) { z.classList.add('viewer-hide'); });

    document.querySelectorAll(SCOPE_FORM).forEach(function (box) {
      box.querySelectorAll('input, select, textarea').forEach(function (f) {
        if (f.type === 'search' || /search|cari/i.test((f.id || '') + ' ' + (f.className || ''))) return;
        f.disabled = true;
        f.classList.add('viewer-locked');
      });
    });

    document.querySelectorAll('textarea').forEach(function (t) {
      t.disabled = true;
      t.placeholder = 'Akun Admin hanya bisa melihat';
    });
  }

  var scheduled = false;
  function schedule() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(function () { scheduled = false; lock(); });
  }
  lock();
  try { new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true }); } catch (e3) {}
  document.addEventListener('DOMContentLoaded', lock);
})();
</script>

    function jadwalTabel() { if (antriTabel) return; antriTabel = true; requestAnimationFrame(function () { antriTabel = false; tandaiTabel(); }); }
    tandaiTabel();
    if (isi && window.MutationObserver) new MutationObserver(jadwalTabel).observe(isi, { childList: true, subtree: true });

    // Beranda
    var statGrid = isi && isi.querySelector('.stat-grid');
    if (statGrid && dash.aktif) {
      document.body.classList.add('mb-home');
      var ttlBar = bar.querySelector('.mb-ttl b'); if (ttlBar) ttlBar.textContent = 'Beranda';

      function angka(re) {
        var c = [].slice.call(statGrid.querySelectorAll('.stat-card')).filter(function (x) { return re.test((x.querySelector('.label') || {}).textContent || ''); })[0];
        return c ? ((c.querySelector('.num') || {}).textContent || '0').trim() : '0';
      }
      var nm = (document.querySelector('.user-info .name') || {}).textContent || '';
      nm = nm.trim().split('@')[0].replace(/[._]/g, ' ');
      nm = nm ? nm.replace(/\b\w/g, function (h) { return h.toUpperCase(); }) : (viewer ? 'Admin' : 'Super Admin');
      var jam = new Date().getHours();
      var salam = jam < 11 ? 'Selamat pagi' : jam < 15 ? 'Selamat siang' : jam < 18 ? 'Selamat sore' : 'Selamat malam';
      var tgl = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      var PENDEK = { 'Penggabungan Saldo': 'Gabung Saldo', 'Koreksi Tenaga Kerja': 'Koreksi Data', 'Laporan Kecelakaan': 'Kecelakaan', 'Perbaikan NPP': 'Perbaikan NPP', 'Penggabungan Keluarga': 'Keluarga', 'Ketenagakerjaan': 'BPJS TK', 'Kesehatan': 'BPJS Kes' };
      var cepat = pengajuan.concat(payment).slice(0, 8).map(function (x, i) {
        return '<a class="mb-q c' + ((i % 4) + 1) + '" href="' + esc(x.href) + '" target="_top"><i>' + x.svg + '</i>' + esc(PENDEK[x.label] || x.label) + '</a>';
      }).join('');

      var home = document.createElement('div');
      home.className = 'mb-home-box';
      home.innerHTML =
        '<div class="mb-hi"><small>' + esc(tgl) + '</small><h2>' + esc(salam) + ', ' + esc(nm) + '</h2></div>' +
        '<div class="mb-sum"><button class="go" id="mbSumGo">Lihat</button>' +
          '<div class="k">Perlu diproses</div><div class="v">' + esc(angka(/belum/i)) + '</div>' +
          '<div class="s">pengajuan menunggu tindakan</div>' +
          '<div class="mb-sumrow"><div class="chip"><b>' + esc(angka(/total kasus/i)) + '</b><span>Total kasus</span></div>' +
          '<div class="chip"><b>' + esc(angka(/selesai/i)) + '</b><span>Selesai</span></div>' +
          '<div class="chip"><b>' + esc(angka(/karyawan/i)) + '</b><span>Karyawan</span></div></div></div>' +
        '<div class="mb-h3"><b>Menu cepat</b></div><div class="mb-quick">' + cepat + '</div>' +
        '<div class="mb-h3"><b>Ringkasan</b></div>';
      statGrid.parentNode.insertBefore(home, statGrid);
      var go = document.getElementById('mbSumGo');
      if (go) go.addEventListener('click', function () { bukaSheet('Pengajuan'); });
    }


    // ================= VERSI 3: perbesar huruf kecil secara proporsional =================
    var LEWATI = '.mb-bar,.mb-nav,.mb-sheet-wrap,.mb-hi,.mb-sum,.mb-quick,.mb-h3,svg';
    function punyaTeks(el) {
      if (/^(INPUT|SELECT|TEXTAREA|BUTTON|OPTION)$/.test(el.tagName)) return true;
      for (var n = el.firstChild; n; n = n.nextSibling) {
        if (n.nodeType === 3 && n.nodeValue.trim()) return true;
      }
      return false;
    }
    function besarkanHuruf(root) {
      if (!window.matchMedia('(max-width:768px)').matches) return;
      (root || document).querySelectorAll('.app-content *, .cm-overlay *, .detail-overlay *, .toast-wrap *').forEach(function (el) {
        if (el.hasAttribute('data-mbfs') || el.closest(LEWATI) || !punyaTeks(el)) return;
        el.setAttribute('data-mbfs', '1');
        var fs = parseFloat(getComputedStyle(el).fontSize) || 0;
        if (!fs || fs >= 15) return;
        var baru = Math.max(13, Math.round(fs * 1.16 * 2) / 2);
        if (fs < 15 && baru > 16) baru = 16;
        el.style.setProperty('font-size', baru + 'px', 'important');
      });
    }
    var antriHuruf = false;
    function jadwalHuruf() { if (antriHuruf) return; antriHuruf = true; setTimeout(function () { antriHuruf = false; besarkanHuruf(); }, 60); }
    besarkanHuruf();
    if (window.MutationObserver) new MutationObserver(jadwalHuruf).observe(document.body, { childList: true, subtree: true });

    // Getaran halus saat menekan menu (Android)
    document.addEventListener('click', function (e) {
      if (navigator.vibrate && e.target.closest && e.target.closest('.mb-item,.mb-tile,.mb-q,.mb-out')) { try { navigator.vibrate(8); } catch (x) {} }
    }, true);

    // ---- Angka badge mengikuti badge di sidebar ----
    function sinkronBadge() {
      document.querySelectorAll('[data-badge]').forEach(function (el) {
        var src = document.getElementById(el.getAttribute('data-badge'));
        var tampil = src && src.style.display !== 'none' && src.textContent.trim() !== '';
        el.textContent = tampil ? src.textContent.trim() : '';
        el.classList.toggle('on', !!tampil);
      });
    }
    sinkronBadge();
    ['badgePesan', 'badgeAnonim'].forEach(function (id) {
      var src = document.getElementById(id);
      if (src && window.MutationObserver) {
        new MutationObserver(sinkronBadge).observe(src, { attributes: true, childList: true, characterData: true, subtree: true });
      }
    });
  });
})();
</script>
