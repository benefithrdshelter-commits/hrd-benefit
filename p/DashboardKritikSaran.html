<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kritik &amp; Saran</title>
<style>
  .ks-head h1{font-size:19px;font-weight:700;margin:0 0 4px}
  .ks-head p{font-size:12.5px;color:var(--muted);margin:0}
  .ks{--red:#E4483A}
  .tabs{display:flex;gap:6px;margin:0 0 14px}
  .tab{border:none;background:transparent;padding:8px 15px;border-radius:99px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit}
  .tab.active{background:var(--blue-tint);color:var(--blue-deep)}
  .tab .cnt{background:rgba(0,0,0,.07);border-radius:99px;padding:1px 7px;margin-left:5px;font-size:11px}
  .kc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px}
  .kc.unread{border-left:3px solid var(--red)}
  .kh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
  .kd{font-size:11.5px;color:var(--muted)}
  .pill{padding:3px 10px;border-radius:99px;font-size:10.5px;font-weight:700}
  .pill.b{background:#FDECEA;color:var(--red)} .pill.s{background:var(--green-tint);color:var(--green)}
  .kt{font-size:13.5px;line-height:1.6;color:#2B3547;white-space:pre-wrap;word-break:break-word}
  .ka{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
  .ib{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit}
  .ib:hover{background:var(--blue-tint);color:var(--blue-deep)}
  .ib.danger:hover{background:#FDECEA;color:var(--red)}
  .empty{text-align:center;padding:50px 10px;color:var(--muted);font-size:13px}
  .btn-logout{display:inline-flex;align-items:center;gap:8px;background:#E4483A;color:#fff !important;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;box-shadow:0 8px 18px -8px rgba(228,72,58,.6)}
  .btn-logout:hover{background:#C93A2D}
</style>
</head>
<body>
<div class="app-shell ks">
  <?!= sidebarHtml ?>
  <div class="app-content">

    <div class="hero-banner compact">
      <div class="topbar">
        <div class="spacer"></div>
        <a class="btn-logout" href="<?!= baseUrl ?>?page=logout&token=<?!= token ?>" target="_top">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M7.5 17.5H4.5C3.7 17.5 3 16.8 3 16V4C3 3.2 3.7 2.5 4.5 2.5H7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M13 14L17 10L13 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 10H7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Keluar
        </a>
      </div>
      <div class="hero-body">
        <div>
          <div class="page-title">Kritik &amp; Saran</div>
          <div class="page-sub">Masukan anonim dari karyawan. Identitas pengirim tidak dicatat. Hapus pesan setelah selesai dibaca.</div>
        </div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-f="all">Semua <span class="cnt" id="cAll">0</span></button>
      <button class="tab" data-f="belum">Belum Dibaca <span class="cnt" id="cBelum">0</span></button>
    </div>
    <div id="list"><div class="empty">Memuat...</div></div>
  </div>
</div>
<script>
var TOKEN = "<?= token ?>", ALL = [], F = 'all', LJ = '';
function $(id){ return document.getElementById(id); }
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function run(fn,args,ok){
  var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){ alert('Gagal: ' + (e && e.message ? e.message : e)); });
  r[fn].apply(r,args);
}
function load(){
  run('adminGetAnonim',[TOKEN],function(raw){
    if(raw === LJ) return; LJ = raw;
    var d = null; try{ d = JSON.parse(raw); }catch(e){}
    ALL = Array.isArray(d) ? d : [];
    render(); if(window.refreshBadgeAnonim) refreshBadgeAnonim();
  });
}
function render(){
  var belum = ALL.filter(function(m){ return m.status !== 'Sudah Dibaca'; });
  $('cAll').textContent = ALL.length; $('cBelum').textContent = belum.length;
  var rows = F === 'belum' ? belum : ALL;
  $('list').innerHTML = rows.length ? rows.map(function(m){
    var un = m.status !== 'Sudah Dibaca';
    return '<div class="kc'+(un?' unread':'')+'"><div class="kh"><span class="kd">'+esc(m.date)+' &middot; '+esc(m.time)+'</span>'
      + '<span class="pill '+(un?'b':'s')+'">'+(un?'Belum Dibaca':'Sudah Dibaca')+'</span></div>'
      + '<div class="kt">'+esc(m.text)+'</div><div class="ka">'
      + (un ? '<button class="ib" data-act="read" data-id="'+esc(m.id)+'">Tandai dibaca</button>' : '')
      + '<button class="ib danger" data-act="del" data-id="'+esc(m.id)+'">Hapus</button></div></div>';
  }).join('') : '<div class="empty">Belum ada kritik atau saran.</div>';
}
document.querySelector('.tabs').addEventListener('click',function(e){
  var f = e.target.closest('.tab'); if(!f) return; F = f.getAttribute('data-f');
  [].forEach.call(document.querySelectorAll('.tab'),function(t){ t.classList.toggle('active', t === f); }); render();
});
$('list').addEventListener('click',function(e){
  var b = e.target.closest('button'); if(!b) return;
  var id = b.getAttribute('data-id'), act = b.getAttribute('data-act');
  if(act === 'read') run('adminMarkAnonimRead',[TOKEN,id],function(){ LJ=''; load(); });
  if(act === 'del'){
    if(!confirm('Hapus pesan ini? Pesan hilang permanen.')) return;
    run('adminDeleteAnonim',[TOKEN,id],function(){ LJ=''; load(); });
  }
});
load(); setInterval(load, 30000);
</script>
</body>
</html>
